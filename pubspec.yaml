name: chess_ai_desktop
description: "Windows-first Flutter desktop chess AI project with local engine play and optional LLM banter."
publish_to: "none"
version: 1.2.1+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.1
  cupertino_icons: ^1.0.8
  dartchess: ^0.13.1
  dartchess_webok: ^0.2.2
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.3.1
  http: ^1.6.0
  web: ^1.1.1
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # BEGIN GENERATED ASSETS: run `rtk uv run python .\tools\sync_pubspec_assets.py`
    # Theme previews.
    - assets/chess/themes/

    # Board texture sets.
    - assets/chess/board_textures/autumn_academy/
    - assets/chess/board_textures/classic_wood/
    - assets/chess/board_textures/coral_reef/
    - assets/chess/board_textures/crystal_cavern/
    - assets/chess/board_textures/desert_sun/
    - assets/chess/board_textures/frost_temple/
    - assets/chess/board_textures/jungle_canopy/
    - assets/chess/board_textures/lava_forge/
    - assets/chess/board_textures/midnight_observatory/
    - assets/chess/board_textures/neon_city/
    - assets/chess/board_textures/ocean_slate/
    - assets/chess/board_textures/royal_marble/
    - assets/chess/board_textures/sakura_garden/
    - assets/chess/board_textures/sky_citadel/
    - assets/chess/board_textures/tournament_green/
    - assets/chess/board_textures/walnut_study/

    # Piece sets.
    - assets/chess/pieces/cburnett_png/
    # END GENERATED ASSETS
